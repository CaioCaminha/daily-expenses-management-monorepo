plugins {
    id 'java'
    id 'daily-expenses-management.spring-library'
}

group = 'com.caminha.javadailyexpenses'
version = '0.0.1-SNAPSHOT'
description = 'postgres-utils'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    gradlePluginPortal()
}

dependencies {
    // PostgreSQL Dependencies
    api 'org.springframework.data:spring-data-r2dbc'
    implementation 'org.postgresql:postgresql'
    api 'org.postgresql:r2dbc-postgresql'
    implementation 'io.r2dbc:r2dbc-pool'

    implementation 'org.springframework.boot:spring-boot-starter'

    // This automatically enables AOP on the project
    // No need to use @EnableAspectJAutoProxy anymore
    implementation 'org.springframework.boot:spring-boot-starter-aop:3.5.6'

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('bootJar') {
    enabled = false
}

tasks.named('jar') {
    enabled = false
}