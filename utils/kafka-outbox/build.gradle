plugins {
    id 'daily-expenses-management.spring-library'
}

group = 'com.caminha.javadailyexpenses'
version = 'unspecified'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'

    implementation project(':utils:kafka-utils')
    implementation project(':utils:redis-utils')
    implementation project(':utils:json-utils')
    implementation project(':utils:postgres-utils')

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
}

test {
    useJUnitPlatform()
}