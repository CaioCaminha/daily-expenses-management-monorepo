  db:
    image: postgres
    container_name: postgres
    restart: always
    shm_size: 128mb
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=daily-expenses-db
  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka-java-daily-expenses
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"   # pin explicitly so it's stable across restarts
    restart: always
    ports:
      - "9092:9092"
      - "9094:9094"
  outbox-trigger:
    image: outbox-trigger:latest
    container_name: outbox-trigger
    environment:
      - KAFKA_BOOTSTRAP_SERVER=kafka:9092
      - KAFKA_OUTBOX_TOPIC=outbox-trigger
    depends_on:
      - kafka
  redis:
    image: redis:alpine
    container_name: expenses-manager-redis
    command: redis-server --requirepass expenses-manager-pass
    environment:
      - REDIS_ARGS="--appendonly yes"
    volumes:
      - /home/caio-caminha/Documents/projects/daily-expenses-management/redis-utils/docker/volume/data:/data
    ports:
      - "6379:6379"
  grafana:
    image: grafana/grafana
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - /home/caio-caminha/Documents/projects/daily-expenses-management/expenses-manager/grafana/grafana-volume:/var/lib/grafana
  prometheus:
    image: prom/prometheus
    container_name: prometheus-java-daily-expenses
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - /home/caio-caminha/Documents/projects/daily-expenses-management/expenses-manager/prometheus-testing/prometheus.yml:/etc/prometheus/prometheus.yml
